<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Fireworks Realistic Trails</title>
<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  overflow:hidden;
}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
/* ===== CANVAS ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* ===== ÂM THANH ===== */
let audioEnabled=false;
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
addEventListener("click",()=>{audioCtx.resume();audioEnabled=true;});

function playBoom(){
  if(!audioEnabled) return;
  const t=audioCtx.currentTime;

  // tiếng trầm "bùm"
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="triangle";
  osc.frequency.setValueAtTime(90,t);
  osc.frequency.exponentialRampToValueAtTime(40,t+0.25);
  gain.gain.setValueAtTime(0.5,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+0.35);

  // tiếng xé không khí
  const size=audioCtx.sampleRate*1.2;
  const buf=audioCtx.createBuffer(1,size,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<size;i++)
    data[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*0.4));

  const noise=audioCtx.createBufferSource();
  noise.buffer=buf;
  const ng=audioCtx.createGain();
  ng.gain.setValueAtTime(0.25,t);
  ng.gain.exponentialRampToValueAtTime(0.001,t+1);

  const hp=audioCtx.createBiquadFilter();
  hp.type="highpass"; hp.frequency.value=700;
  noise.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination);
  noise.start(t+0.03); noise.stop(t+1);
}

/* ===== PHÁO HOA ===== */
const gravity=0.04;
const friction=0.985;
const fireworks=[];
const particles=[];

const palettes=[
  [20,30,40],
  [200,210,220],
  [330,340,350],
  [120,130,140],
  [260,270,280]
];

class Firework{
  constructor(){
    this.x=Math.random()*canvas.width;
    this.y=canvas.height;
    this.vy=Math.random()*3+9;
    this.targetY=Math.random()*canvas.height*0.45+120;
    this.palette=palettes[Math.floor(Math.random()*palettes.length)];
    this.type=Math.floor(Math.random()*5);
  }
  update(){
    this.y-=this.vy;
    this.vy*=0.98;
    if(this.y<=this.targetY){
      explode(this.x,this.y,this.palette,this.type);
      playBoom();
      return true;
    }
    return false;
  }
}

class Particle{
  constructor(x,y,hue,style){
    this.x=x; this.y=y;
    this.prevX=x; this.prevY=y;
    this.angle=Math.random()*Math.PI*2;
    this.speed=style==="willow"?Math.random()*2+2:Math.random()*5+2;
    this.life=style==="willow"?Math.random()*200+220:Math.random()*120+160;
    this.hue=hue;
    this.style=style;
    this.width=style==="willow"?1.8:1;
  }
  update(){
    this.prevX=this.x;
    this.prevY=this.y;

    this.speed*=friction;
    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed
            + gravity*(this.style==="willow"?1.7:1);

    this.life--;
  }
  draw(){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.beginPath();
    ctx.moveTo(this.prevX,this.prevY);
    ctx.lineTo(this.x,this.y);
    ctx.strokeStyle=`hsla(${this.hue},100%,65%,${this.life/260})`;
    ctx.lineWidth=this.width;
    ctx.lineCap="round";
    ctx.stroke();
    ctx.restore();
  }
}

function explode(x,y,palette,type){
  let count=120;
  let style="normal";

  if(type===1){count=180;style="willow";}
  if(type===2){count=80; style="spark";}
  if(type===3){count=140;style="ring";}
  if(type===4){count=220;style="big";}

  for(let i=0;i<count;i++){
    const hue=palette[Math.floor(Math.random()*palette.length)]
              +Math.random()*12-6;
    const p=new Particle(x,y,hue,style);
    if(style==="ring") p.angle=(i/count)*Math.PI*2;
    particles.push(p);
  }
}

/* ===== ANIMATE ===== */
function animate(){
  ctx.fillStyle="rgba(0,0,0,0.35)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=fireworks.length-1;i>=0;i--)
    if(fireworks[i].update()) fireworks.splice(i,1);

  for(let i=particles.length-1;i>=0;i--){
    particles[i].update();
    particles[i].draw();
    if(particles[i].life<=0) particles.splice(i,1);
  }

  requestAnimationFrame(animate);
}

setInterval(()=>fireworks.push(new Firework()),220);
animate();
</script>
</body>
</html>
